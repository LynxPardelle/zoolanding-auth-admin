name: Deploy THN Test

on:
  push:
    branches: [codex/thn-task029-auth-admin]
  workflow_dispatch:
    inputs:
      operation:
        description: Retained state provisioning, private runtime enablement, operator patch, or stateless disablement
        required: true
        type: choice
        options: [provision, enable, operator-patch, authorizer-patch, disable]
      expected_source_sha:
        description: Reviewed full commit SHA already promoted to TEST
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zoolanding-auth-admin-test-deploy
  cancel-in-progress: false

jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: echo 'TEST manual release registered. No checkout, environment, artifact or AWS credentials.'

  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      SAM_CLI_TELEMETRY: 0
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify reviewed manual TEST context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/test"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "LynxPardelle/zoolanding-auth-admin"
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Verify enable has no runtime-source changes since provisioning
        if: inputs.operation == 'enable'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess
          from tools.thn_test_release import PROVISIONED_SOURCE_SHA, verify_enable_source_delta

          head = os.environ["GITHUB_SHA"]
          ancestry = subprocess.run(
              ["git", "merge-base", "--is-ancestor", PROVISIONED_SOURCE_SHA, head],
              check=False, capture_output=True)
          if ancestry.returncode:
              raise SystemExit("provisioned_source_not_ancestor")
          changed = subprocess.run(
              ["git", "diff", "--name-only", "-z", PROVISIONED_SOURCE_SHA + ".." + head],
              check=True, capture_output=True).stdout.decode("utf-8")
          verify_enable_source_delta([path for path in changed.split("\0") if path])
          PY
      - name: Verify operator patch is the exact reviewed TEST promotion
        if: inputs.operation == 'operator-patch'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/dev:refs/remotes/origin/dev
          read -r _commit _first_parent second_parent extra < <(git rev-list --parents -n 1 HEAD)
          test -n "$second_parent"
          test -z "${extra:-}"
          test "$second_parent" = "$(git rev-parse refs/remotes/origin/dev)"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'refs/remotes/origin/dev^{tree}')"
          python - <<'PY'
          import subprocess
          from tools.thn_test_release import verify_operator_patch_source_delta
          changed = subprocess.run(
              ["git", "diff", "--name-only", "-z", "HEAD^1", "HEAD"],
              check=True, capture_output=True).stdout.decode("utf-8")
          verify_operator_patch_source_delta([path for path in changed.split("\0") if path])
          PY
      - name: Verify authorizer patch is the exact reviewed TEST promotion
        if: inputs.operation == 'authorizer-patch'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/dev:refs/remotes/origin/dev
          read -r _commit _first_parent second_parent extra < <(git rev-list --parents -n 1 HEAD)
          test -n "$second_parent"
          test -z "${extra:-}"
          test "$second_parent" = "$(git rev-parse refs/remotes/origin/dev)"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'refs/remotes/origin/dev^{tree}')"
          python - <<'PY'
          import subprocess
          from tools.thn_test_release import verify_authorizer_patch_source_delta
          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True).stdout
          changed = [path for path in git("diff", "--name-only", "-z", "HEAD^1", "HEAD").decode().split("\0") if path]
          prior = None
          if "auth_admin_origin_authorizer_v2.py" not in changed:
              parents = git("rev-list", "--parents", "-n", "1", "HEAD^1").decode().split()
              if (len(parents) != 3 or git("rev-parse", "HEAD^1^{tree}")
                      != git("rev-parse", "HEAD^1^2^{tree}")):
                  raise SystemExit("authorizer_patch_prior_promotion_invalid")
              prior = [path for path in git("diff", "--name-only", "-z", "HEAD^1^1", "HEAD^1").decode().split("\0") if path]
          verify_authorizer_patch_source_delta(changed, prior)
          PY
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: 1.163.0
          use-installer: true
          token: ${{ github.token }}
      - name: Validate and build without AWS credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-test.txt -r requirements-release.txt
          python -m pip check
          python -m unittest discover -s tests -p 'test_*.py'
          python -m venv "$RUNNER_TEMP/thn-cfn-lint"
          "$RUNNER_TEMP/thn-cfn-lint/bin/python" -m pip install --disable-pip-version-check cfn-lint==1.56.0
          "$RUNNER_TEMP/thn-cfn-lint/bin/cfn-lint" -t template.yaml -r us-east-1
          sam build --no-cached
          python tools/check_lambda_artifacts.py
      - name: Assemble immutable release and standalone tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .aws-sam/build/release-tools/tools
          cp tools/__init__.py tools/thn_test_release.py tools/prepare_thn_test_parameters.py tools/prepare_test_parameters.py tools/review_test_change_set.py .aws-sam/build/release-tools/tools/
          cp requirements-release.txt .aws-sam/build/release-tools/
          python - <<'PY'
          import json, os
          from pathlib import Path
          metadata = {"schema": "zoolanding-thn-test-release/v1", "service": "zoolanding-auth-admin",
                      "source_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
                      "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"]}
          Path(".aws-sam/build/release-metadata.json").write_text(json.dumps(metadata, sort_keys=True))
          PY
          (cd .aws-sam/build && LC_ALL=C find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > .aws-sam/build-manifest.sha256
      - name: Compute immutable manifest digest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum .aws-sam/build-manifest.sha256 | cut -d ' ' -f 1)"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: zoolanding-thn-auth-test-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            .aws-sam/build/
            .aws-sam/build-manifest.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    environment: test
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      SAM_CLI_TELEMETRY: 0
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      EXPECTED_MANIFEST_DIGEST: ${{ needs.validate.outputs.manifest_digest }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: .aws-sam
          merge-multiple: true
      - name: Verify exact artifact before credentials or execution
        shell: bash
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/test"
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_MANIFEST_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          test -z "$(find .aws-sam -type l -print -quit)"
          (cd .aws-sam/build && LC_ALL=C find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/recomputed-build-manifest.sha256"
          cmp --silent .aws-sam/build-manifest.sha256 "$RUNNER_TEMP/recomputed-build-manifest.sha256"
          printf '%s  %s\n' "$EXPECTED_MANIFEST_DIGEST" .aws-sam/build-manifest.sha256 | sha256sum --check --strict -
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          actual = json.loads(Path(".aws-sam/build/release-metadata.json").read_text())
          expected = {"schema": "zoolanding-thn-test-release/v1", "service": "zoolanding-auth-admin",
                      "source_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
                      "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"]}
          if actual != expected:
              raise SystemExit("artifact_identity_mismatch")
          PY
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: 1.163.0
          use-installer: true
          token: ${{ github.token }}
      - name: Install pinned release dependencies
        run: python -m pip install --disable-pip-version-check -r .aws-sam/build/release-tools/requirements-release.txt
      - name: Validate operation and selection before AWS credentials
        env:
          THN_OPERATION: ${{ inputs.operation }}
          THN_V2_TEST_PARAMETERS_JSON: ${{ vars.THN_V2_TEST_PARAMETERS_JSON }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, '.aws-sam/build/release-tools')
          from tools.thn_test_release import validate_context, lifecycle_parameters
          validate_context(dict(os.environ))
          lifecycle_parameters({'Parameters': [
            {'ParameterKey': 'EnvironmentName', 'ParameterValue': 'test'},
            {'ParameterKey': 'ProvisionThnAuthAdminV2State', 'ParameterValue': 'true'},
            {'ParameterKey': 'EnableThnAuthAdminV2',
             'ParameterValue': 'true' if os.environ['THN_OPERATION'] in ('operator-patch', 'authorizer-patch') else 'false'}]},
            os.environ['THN_OPERATION'], os.environ.get('THN_V2_TEST_PARAMETERS_JSON'))
          PY
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Execute one reviewed THN-only retained-state update
        env:
          THN_OPERATION: ${{ inputs.operation }}
          THN_V2_TEST_PARAMETERS_JSON: ${{ vars.THN_V2_TEST_PARAMETERS_JSON }}
          ARTIFACTS_BUCKET: ${{ vars.SAM_ARTIFACTS_BUCKET }}
        run: python .aws-sam/build/release-tools/tools/thn_test_release.py --operation "$THN_OPERATION"
      - name: Record public-safe release coordinates
        env:
          ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          THN_OPERATION: ${{ inputs.operation }}
        run: |
          {
            echo '### THN Auth Admin TEST release'
            echo "- operation: $THN_OPERATION"
            echo "- source_sha: $GITHUB_SHA"
            echo "- artifact_id: $ARTIFACT_ID"
            echo "- manifest_sha256: $EXPECTED_MANIFEST_DIGEST"
            echo '- Shared auth configuration preserved; retained state checked twice.'
            echo '- Registry, owner onboarding and front-door activation remain separate.'
          } >> "$GITHUB_STEP_SUMMARY"
