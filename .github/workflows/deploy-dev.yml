name: Deploy Dev

on:
  push:
    branches: [dev]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ vars.AWS_ROLE_ARN != '' && vars.AUTH_ADMIN_CONFIG_JSON_BASE64 != '' && vars.COGNITO_USER_POOL_ARNS != '' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Set up SAM
        uses: aws-actions/setup-sam@v3
      - name: Validate auth admin config
        shell: bash
        env:
          AUTH_ADMIN_CONFIG_JSON_BASE64: ${{ vars.AUTH_ADMIN_CONFIG_JSON_BASE64 }}
          AUTH_ADMIN_ENVIRONMENT: dev
          COGNITO_USER_POOL_ARNS: ${{ vars.COGNITO_USER_POOL_ARNS }}
        run: |
          set -euo pipefail
          test -n "${COGNITO_USER_POOL_ARNS:-}" || { echo "COGNITO_USER_POOL_ARNS is required for deploy"; exit 1; }
          output_path="$RUNNER_TEMP/auth-admin-config.compact.b64"
          export OUTPUT_CONFIG_PATH="$output_path"
          python - <<'PY'
          import base64, json, os, pathlib
          import lambda_function as auth_admin
          raw = os.environ.get("AUTH_ADMIN_CONFIG_JSON_BASE64", "")
          if not raw:
              raise SystemExit("AUTH_ADMIN_CONFIG_JSON_BASE64 is required for deploy")
          decoded = base64.b64decode(raw).decode("utf-8")
          parsed = json.loads(decoded)
          auth_admin.load_config()
          compact = json.dumps(parsed, separators=(",", ":")).encode("utf-8")
          pathlib.Path(os.environ["OUTPUT_CONFIG_PATH"]).write_text(base64.b64encode(compact).decode("ascii"), encoding="utf-8")
          PY
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Test and deploy
        shell: bash
        env:
          COGNITO_USER_POOL_ARNS: ${{ vars.COGNITO_USER_POOL_ARNS }}
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py"
          sam validate
          sam build --no-cached
          AUTH_ADMIN_CONFIG_JSON_BASE64="$(cat "$RUNNER_TEMP/auth-admin-config.compact.b64")"
          sam deploy --config-env dev --no-confirm-changeset --no-fail-on-empty-changeset --parameter-overrides "EnvironmentName=dev" "AuthAdminConfigJsonBase64=${AUTH_ADMIN_CONFIG_JSON_BASE64}" "CognitoUserPoolArns=${COGNITO_USER_POOL_ARNS}" "LogLevel=INFO"
