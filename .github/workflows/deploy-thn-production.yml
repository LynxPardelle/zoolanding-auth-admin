name: THN Production Retained Release
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        options: [review, execute, cleanup]
      purpose:
        type: choice
        required: true
        options: [state, activate, general, recover]
      source_sha:
        type: string
        required: true
      review_run_id:
        type: string
        required: false
      approved_digest:
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: thn-production-retained-auth
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PURPOSE: ${{ inputs.purpose }}
      OPERATION: ${{ inputs.operation }}
      REVIEW_RUN_ID: ${{ inputs.review_run_id }}
      APPROVED_DIGEST: ${{ inputs.approved_digest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Require current main and exact protected inputs before credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          python tools/run_thn_production_release.py validate --source-sha "$SOURCE_SHA" --purpose "$PURPOSE" --approved-digest "$APPROVED_DIGEST"
          if [[ "$OPERATION" != review || "$PURPOSE" == recover ]]; then
            [[ "$REVIEW_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          fi
          if [[ "$OPERATION" == execute ]]; then
            [[ "$APPROVED_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          fi
      - name: Install declared offline release guard dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-release.txt
      - name: Run offline guards
        run: python -m unittest discover -s tests -p 'test_thn_production_release.py'
  release:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PURPOSE: ${{ inputs.purpose }}
      OPERATION: ${{ inputs.operation }}
      REVIEW_RUN_ID: ${{ inputs.review_run_id }}
      APPROVED_DIGEST: ${{ inputs.approved_digest }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      THN_PRODUCTION_PARAMETERS_JSON: ${{ secrets.THN_PRODUCTION_PARAMETERS_JSON }}
      THN_PRODUCTION_PERMISSION_PLAN_JSON: ${{ secrets.THN_PRODUCTION_PERMISSION_PLAN_JSON }}
      THN_PRODUCTION_PREREQUISITES_JSON: ${{ secrets.THN_PRODUCTION_PREREQUISITES_JSON }}
      GH_TOKEN: ${{ github.token }}
      AWS_EC2_METADATA_DISABLED: 'true'
      SAM_CLI_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install declared release dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-release.txt
      - name: Require exact reviewed caller role before assuming credentials
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from tools.thn_production_service import CONFIG
          role = CONFIG.get('generalDeployRole', CONFIG['deployRole']) if os.environ['PURPOSE']=='general' else CONFIG['deployRole']
          assert os.environ['AWS_ROLE_ARN']=='arn:aws:iam::765932874577:role/'+role
          PY
      - name: Verify retained review provenance before downloading
        if: inputs.operation != 'review' || inputs.purpose == 'recover'
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEW_RUN_ID" > "$RUNNER_TEMP/review-run.json"
          python - <<'PY'
          import json,os,pathlib
          value=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'review-run.json').read_text())
          assert value['event']=='workflow_dispatch' and value['head_branch']=='main'
          assert value['path']=='.github/workflows/deploy-thn-production.yml'
          assert value['status']=='completed' and value['conclusion']=='success'
          if os.environ['PURPOSE']!='recover' and os.environ['OPERATION']!='cleanup': assert value['head_sha']==os.environ['SOURCE_SHA']
          PY
          gh run download "$REVIEW_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "thn-production-auth-review-$REVIEW_RUN_ID" --dir retained-review
          test "$(find retained-review -type f | wc -l)" = 1
          if [[ "$PURPOSE" == recover && "$OPERATION" == review ]]; then
            cp retained-review/production-review.json previous-production-review.json
          else
            cp retained-review/production-review.json production-review.json
          fi
      - name: Set up SAM for review only
        if: inputs.operation == 'review' && inputs.purpose != 'recover'
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: '1.163.0'
          use-installer: true
          token: ${{ github.token }}
      - name: Validate and build closed production source
        if: inputs.operation == 'review' && inputs.purpose != 'recover'
        shell: bash
        run: |
          set -euo pipefail
          python tools/prepare_thn_production_template.py template.yaml production-source.json
          python -m venv "$RUNNER_TEMP/thn-production-cfn-lint"
          "$RUNNER_TEMP/thn-production-cfn-lint/bin/python" -m pip install --disable-pip-version-check cfn-lint==1.56.0
          "$RUNNER_TEMP/thn-production-cfn-lint/bin/cfn-lint" --non-zero-exit-code error production-source.json
          sam build --template-file production-source.json --no-cached
      - name: Recheck current main immediately before credentials
        shell: bash
        run: python tools/run_thn_production_release.py validate --source-sha "$SOURCE_SHA" --purpose "$PURPOSE" --approved-digest "$APPROVED_DIGEST"
      - name: Assume selected production deployment identity
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '765932874577'
      - name: Verify effective permissions and live baseline before package writes
        shell: bash
        run: python tools/run_thn_production_release.py preflight --source-sha "$SOURCE_SHA" --purpose "$PURPOSE"
      - name: Package new candidate only for review
        if: inputs.operation == 'review' && inputs.purpose != 'recover'
        shell: bash
        run: |
          set -euo pipefail
          sam package --template-file .aws-sam/build/template.yaml --s3-bucket zlp-thn-production-releases-765932874577-us-east-1 --s3-prefix "thn/production/auth/$SOURCE_SHA/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/packages" --output-template-file packaged-production.json
      - name: Review or execute the exact retained native preview
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_thn_production_release.py "$OPERATION" --source-sha "$SOURCE_SHA" --purpose "$PURPOSE" --approved-digest "$APPROVED_DIGEST"
      - name: Transport only sealed review fingerprints and sanitized inventory
        if: inputs.operation == 'review'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thn-production-auth-review-${{ github.run_id }}
          path: production-review.json
          retention-days: 30
          if-no-files-found: error
