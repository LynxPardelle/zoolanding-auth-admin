name: Deploy Test

on:
  push:
    branches: [test]

permissions:
  contents: read

concurrency:
  group: zoolanding-auth-admin-test-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      SAM_CLI_TELEMETRY: 0
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.identity.outputs.name }}
      manifest_digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: 1.163.0
          use-installer: true
          token: ${{ github.token }}
      - name: Verify exact TEST promotion context
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "release_sha_invalid"; exit 1; }
          test "$GITHUB_REF" = "refs/heads/test"
          test "$PUSH_FORCED" != "true"
          git fetch --no-tags origin refs/heads/dev:refs/remotes/origin/dev
          read -r commit first_parent second_parent extra < <(git rev-list --parents -n 1 HEAD)
          test -n "$commit"
          test -n "$first_parent"
          test -n "$second_parent"
          test -z "${extra:-}"
          test "$first_parent" = "$BEFORE_SHA"
          test "$second_parent" = "$(git rev-parse refs/remotes/origin/dev)"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'refs/remotes/origin/dev^{tree}')"
      - name: Test, validate, and build exact source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check
          python -m unittest discover -s tests -p "test_*.py"
          sam validate
          sam build --no-cached
          python tools/check_lambda_artifacts.py
      - name: Assemble immutable release artifact
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          SERVICE_ID: zoolanding-auth-admin
        run: |
          set -euo pipefail
          mkdir -p .aws-sam/build/release-tools
          cp tools/review_test_change_set.py .aws-sam/build/release-tools/
          cp tools/prepare_test_parameters.py .aws-sam/build/release-tools/
          cp tools/run_test_change_set.sh .aws-sam/build/release-tools/
          cp tools/smoke_test_stack.sh .aws-sam/build/release-tools/
          cp tools/check_thn_v2_ordinary_deploy.py .aws-sam/build/release-tools/
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = {
              "schema": "zoolanding-test-release/v1",
              "service": os.environ["SERVICE_ID"],
              "source_sha": os.environ["RELEASE_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          Path(".aws-sam/build/release-metadata.json").write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          (cd .aws-sam/build && LC_ALL=C find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > .aws-sam/build-manifest.sha256
      - name: Compute release identity
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum .aws-sam/build-manifest.sha256 | cut -d ' ' -f 1)"
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || { echo "manifest_digest_invalid"; exit 1; }
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Define artifact name
        id: identity
        shell: bash
        env:
          ARTIFACT_NAME: zoolanding-auth-admin-test-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: printf 'name=%s\n' "$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload exact validated artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.name }}
          path: |
            .aws-sam/build/
            .aws-sam/build-manifest.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    environment: test
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate immutable artifact coordinates
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          EXPECTED_MANIFEST_DIGEST: ${{ needs.validate.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "source_sha_invalid"; exit 1; }
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "artifact_id_invalid"; exit 1; }
          [[ "$EXPECTED_MANIFEST_DIGEST" =~ ^[a-f0-9]{64}$ ]] || { echo "manifest_digest_invalid"; exit 1; }
          test "$GITHUB_REF" = "refs/heads/test"
      - name: Download exact artifact by immutable ID
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: .aws-sam
          merge-multiple: true
      - name: Verify transported artifact and source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_MANIFEST_DIGEST: ${{ needs.validate.outputs.manifest_digest }}
          EXPECTED_SERVICE: zoolanding-auth-admin
        run: |
          set -euo pipefail
          test -z "$(find .aws-sam -type l -print -quit)"
          (cd .aws-sam/build && LC_ALL=C find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/recomputed-build-manifest.sha256"
          cmp --silent .aws-sam/build-manifest.sha256 "$RUNNER_TEMP/recomputed-build-manifest.sha256"
          printf '%s  %s\n' "$EXPECTED_MANIFEST_DIGEST" .aws-sam/build-manifest.sha256 | sha256sum --check --strict -
          (cd .aws-sam/build && sha256sum --check --strict ../build-manifest.sha256)
          python3 - "$EXPECTED_SHA" "$EXPECTED_SERVICE" <<'PY'
          import json
          from pathlib import Path
          import sys
          payload = json.loads(Path(".aws-sam/build/release-metadata.json").read_text(encoding="utf-8"))
          if (
              payload.get("schema") != "zoolanding-test-release/v1"
              or payload.get("source_sha") != sys.argv[1]
              or payload.get("service") != sys.argv[2]
          ):
              raise SystemExit("release_metadata_invalid")
          PY
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: 1.163.0
          use-installer: true
          token: ${{ github.token }}
      - name: Prepare exact TEST parameters without AWS credentials
        shell: bash
        env:
          ARTIFACTS_BUCKET: ${{ vars.SAM_ARTIFACTS_BUCKET }}
          AUTH_ADMIN_CONFIG_READY: ${{ vars.AUTH_ADMIN_CONFIG_READY }}
          AUTH_ADMIN_CONFIG_JSON_BASE64: ${{ secrets.AUTH_ADMIN_CONFIG_JSON_BASE64 }}
          COGNITO_USER_POOL_ARNS: ${{ vars.COGNITO_USER_POOL_ARNS }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACTS_BUCKET" || { echo "sam_artifacts_bucket_required"; exit 1; }
          python3 .aws-sam/build/release-tools/prepare_test_parameters.py
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Refuse ordinary deploy when THN v2 state is active
        shell: bash
        run: python .aws-sam/build/release-tools/check_thn_v2_ordinary_deploy.py
      - name: Create, describe, review, and execute exact change set
        shell: bash
        env:
          STACK_NAME: zoolanding-auth-admin-test
          CHANGE_SET_NAME: release-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_SHA: ${{ github.sha }}
          ARTIFACTS_BUCKET: ${{ vars.SAM_ARTIFACTS_BUCKET }}
          PARAMETER_FILE: ${{ runner.temp }}/test-release-parameters/parameters.json
          EXPECTED_PARAMETER_FILE: ${{ runner.temp }}/test-release-parameters/expected-parameters.txt
          REQUIRED_PARAMETER_FILE: ${{ runner.temp }}/test-release-parameters/required-parameters.txt
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          CHANGE_SET_COMMANDS: create-change-set describe-change-set execute-change-set
          STATEFUL_RESOURCE_GUARD: stateful_resource_change_forbidden
        run: bash .aws-sam/build/release-tools/run_test_change_set.sh
      - name: Post-deploy smoke
        shell: bash
        env:
          STACK_NAME: zoolanding-auth-admin-test
        run: bash .aws-sam/build/release-tools/smoke_test_stack.sh
      - name: Record immutable release coordinates
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          MANIFEST_DIGEST: ${{ needs.validate.outputs.manifest_digest }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          {
            echo "### TEST release"
            echo "- source_run_id: $GITHUB_RUN_ID"
            echo "- source_artifact_id: $ARTIFACT_ID"
            echo "- source_sha: $RELEASE_SHA"
            echo "- source_manifest_sha256: $MANIFEST_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
